<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>PLANIX — AI-First Productivity OS for Developers & Students</title>
  <meta name="description" content="AI-first Productivity OS designed specifically for Engineering Students, Developers, AI Engineers, and Builders.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#09090B">

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json">

  <!-- Google Fonts: Inter typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Modular CSS Design System -->
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/views.css">
  <link rel="stylesheet" href="/css/animations.css">
</head>
<body>
  <div class="ambient-bg"></div>
  <div id="app-root">
    <div style="display: flex; height: 100vh; align-items: center; justify-content: center; background: #09090B; color: #F4F4F4;">
      <div style="text-align: center; display: flex; align-items: center; gap: 12px;">
        <div style="width: 44px; height: 44px; border-radius: 10px; background: linear-gradient(135deg, #3B82F6 0%, #8B5CF6 100%); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 900; font-size: 22px;">P</div>
        <div style="font-size: 42px; font-weight: 900; letter-spacing: 1px;">
          <span style="color: #FFFFFF;">PLAN</span><span style="color: #3B82F6;">IX</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Services & Core Store -->
  <script src="/js/services/apiClient.js"></script>
  <script src="/js/store.js"></script>

  <!-- Component Modules -->
  <script src="/js/components/sidebar.js"></script>
  <script src="/js/components/commandPalette.js"></script>
  <script src="/js/components/aiDrawer.js"></script>
  <script src="/js/components/settingsModal.js"></script>

  <!-- View Modules -->
  <script src="/js/views/dashboardView.js"></script>
  <script src="/js/views/goalsView.js"></script>
  <script src="/js/views/tasksView.js"></script>
  <script src="/js/views/habitsView.js"></script>
  <script src="/js/views/projectsView.js"></script>
  <script src="/js/views/notesView.js"></script>
  <script src="/js/views/calendarView.js"></script>
  <script src="/js/views/engineeringHubView.js"></script>
  <script src="/js/views/placementHubView.js"></script>
  <script src="/js/views/codingHubView.js"></script>
  <script src="/js/views/learningHubView.js"></script>
  <script src="/js/views/resourceLibraryView.js"></script>
  <script src="/js/views/routineView.js"></script>
  <script src="/js/views/studyView.js"></script>
  <script src="/js/views/devWorkspaceView.js"></script>
  <script src="/js/views/journalView.js"></script>
  <script src="/js/views/analyticsView.js"></script>

  <!-- Main SPA Router -->
  <script src="/js/app.js"></script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/public/sw.js')
          .then(reg => console.log('Service Worker registered:', reg.scope))
          .catch(err => console.log('Service Worker registration failed:', err));
      });
    }
  </script>
</body>
</html>
